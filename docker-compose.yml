# Stack de développement local OPTIONNELLE.
# En production, la base est hébergée sur Supabase — ce fichier ne sert
# qu'à faire tourner un PostgreSQL local si tu ne veux pas taper dans Supabase.
# Pour l'utiliser : mettre dans .env
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/les_bikeuses
# puis : docker compose up

services:
  app:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && pnpm install --ignore-workspace && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: les_bikeuses
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  node_modules:
